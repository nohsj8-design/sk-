1. daily는 한국시간 날짜별 실제 실적만 저장합니다. 최근28일/30일 합계나 누적치를 하루 값으로 넣지 않습니다.
2. posts는 cid+ch+asOf별 개별 콘텐츠 누적 스냅샷입니다. date는 게시일, asOf는 누적 기준일입니다.
   format은 short|video|reel|image|other로 구분하며 확인하지 못하면 생략합니다.
   일반 동영상 개별 수치를 확인했다면 형식과 기준일·출처를 함께 저장합니다. 채널의 일반 영상 합계를 단일 게시물로 넣지 않습니다.
3. channelSnapshots는 기간별 채널 성과입니다. ch+collectedAt으로 갱신하며 구조:
   {ch:'ig|fb|yt',collectedAt:'시간대포함ISO',window:{days:28,start:'YYYY-MM-DD 또는 null',end:'YYYY-MM-DD 또는 null',timeZone:'확인된시간대 또는 미확인'},metrics:{views:숫자,followers:숫자, ...},insight:'관찰메모',sources:['검증한출처URL']}
   날짜/시간대를 추정하지 않습니다. followers는 수집시점계정규모이며 기간성과와 별개입니다.
   metric 키와 정의는 README.md와 dashboard-model.js를 따릅니다.
4. collection에는 채널별 attemptedAt/status(ok|partial|failed)/message를 계속 기록합니다.
   기존 방식의 한국어 수집 메모도 화면에서 자동 해석하지만 가능하면 channelSnapshots를 함께 저장합니다.
   메모에는 정확한 기간, 지표명, 원문수치, 누락범위, 출처를 기록합니다. 로그인정보·토큰·개인정보는 금지합니다.
5. updatedAt은 마지막 실제 성공 수집 시각입니다. 전체 실패면 유지합니다.
6. 기간별 성과, 콘텐츠 누적, 일별 실적을 혼합하거나 기간이 다른채널 조회수를 합산하지 않습니다.
7. JSON의 <는 유니코드 escape로 저장합니다. 커밋 전 JSON 문법과 기존이력 보존을 검증합니다.
8. main push -> 자동 exporter -> 공개포트폴리오 sns-dashboard/ 배포를 확인합니다.
-->

  function collection(){
    const coverage=section('어디까지 수집됐나요?','DATA / COVERAGE');const cards=e('div',null,'coverage-grid');model.channels.forEach(c=>{const s=M.latest(model,c.id),records=model.posts.filter(p=>p.ch===c.id),daily=model.daily.filter(r=>r.ch===c.id),n=e('article');n.append(e('h3',c.name),pill(s?'기간 성과 확보':'기간 성과 미수집',s?'good':''),e('p',s?M.period(s):'기간별 수치가 없습니다.'),e('small',`개별 콘텐츠 ${records.length}개 · 일별 데이터 ${daily.length}건`),e('small','수치 수집 · '+collected(s?.collectedAt)));cards.append(n);});coverage.append(cards,note('기간 성과·개별 콘텐츠·일별 실적은 각각 별도로 수집합니다. 한 종류가 있어도 나머지 종류가 확보됐다는 뜻은 아닙니다.'));body.append(coverage);
    const daily=section('일별 실적과 주간 목표','DAILY / VERIFIED DATA');const controls=e('div',null,'controls');controls.append(select('채널',[['all','전체 채널'],...model.channels.map(c=>[c.id,c.name])],state.dailyChannel,v=>{state.dailyChannel=v;render();}),select('집계 기간',[['7','7일'],['30','30일']],state.dailyDays,v=>{state.dailyDays=v;render();}));daily.append(controls);
    const end=model.daily.at(-1)?.date;
    if(!end)daily.append(e('div','한국시간 기준 일별 실적은 아직 수집되지 않았습니다. 기간 합계나 게시물 누적값으로 일별 그래프와 목표 달성률을 만들지 않습니다.','empty'));
    else{const start=shift(end,1-Number(state.dailyDays)),t=M.dailyTotals(model,start,end,state.dailyChannel);daily.append(metric('확인된 일별 조회수 합계',t.value,'회',`${start} — ${end} · ${t.known}/${t.expected} 채널·일 확보${t.complete?'':' · 부분 합계'}`));const scroll=e('div',null,'table-scroll'),table=e('table'),head=e('thead'),hr=e('tr');['날짜','채널','조회수','반응 합계','댓글'].forEach(v=>{const th=e('th',v);th.scope='col';hr.append(th);});head.append(hr);const tb=e('tbody');model.daily.filter(r=>r.date>=start&&r.date<=end&&(state.dailyChannel==='all'||r.ch===state.dailyChannel)).forEach(r=>{const tr=e('tr');[r.date,names[r.ch],number(r.views),number(r.conv),number(r.com)].forEach(v=>tr.append(e('td',v)));tb.append(tr);});table.append(head,tb);scroll.append(table);daily.append(scroll);
      const weekday=new Date(end+'T00:00:00Z').getUTCDay(),mon=shift(end,-((weekday+6)%7)),week=M.dailyTotals(model,mon,end);daily.append(metric('확인된 주간 조회수',week.value,'회',`${mon} — ${end}`));if(week.complete){const ratio=week.value/state.goal*100;daily.append(note('목표 달성률 '+number(ratio)+'% · 목표 '+number(state.goal)+'회'));}else daily.append(note('주간 일별 데이터가 완전하지 않아 목표 달성률을 표시하지 않습니다.'));
    }
    const goal=e('label',null,'field goal-field');goal.append(e('span','주간 목표 조회수'));const input=e('input');input.type='number';input.min='1';input.value=state.goal;goal.append(input);daily.append(goal,button('목표 적용',()=>{const n=Number(input.value);if(Number.isFinite(n)&&n>0){state.goal=n;render();status.textContent='주간 목표가 적용됐습니다.';}}),note('목표는 이 화면에만 적용되며 새로고침하면 원래 값으로 돌아갑니다.'));body.append(daily);
    const rules=section('숫자를 읽는 기준','READING / DEFINITIONS');const list=e('dl',null,'definitions');for(const [name,text] of [['기간 성과','플랫폼이 표시한 최근 28일·30일 등의 합계입니다. 정확한 시작·종료일과 시간대를 확인하지 못한 경우 별도로 표시합니다.'],['콘텐츠 누적','게시 이후 해당 수집 기준일까지 쌓인 개별 콘텐츠 성과입니다. 채널의 기간 합계에 더하지 않습니다.'],['수집 시점별 이력','각 수집 시점의 이동기간 스냅샷입니다. 전날과의 차이는 하루 실적이나 성장률이 아닙니다.'],['미수집과 0','—는 확보하지 못한 값입니다. 0은 실제로 확인된 영(0)이며 서로 다르게 표시합니다.'],['계정 규모','플랫폼별 팔로워·구독자의 단순 합계입니다. 같은 사람의 중복을 제거한 총 이용자 수가 아닙니다.'],['전환·반응','플랫폼에서 확보한 반응 정의를 따릅니다. 구매 전환이나 매출을 의미하지 않으며 서로 다른 정의를 합치지 않습니다.']]){list.append(e('dt',name),e('dd',text));}rules.append(list);body.append(rules);
    const logs=section('수집 기록 원문','AUDIT / SOURCE NOTES');const records=[...model.collection].sort((a,b)=>Date.parse(b.attemptedAt)-Date.parse(a.attemptedAt));records.forEach(r=>{const detail=e('details',null,'source-note'),summary=e('summary',`${names[r.ch]} · ${collected(r.attemptedAt)} · ${r.status==='failed'?'수집 실패':r.status==='partial'?'일부 범위 수집':'수집 완료'}`);detail.append(summary,e('p',r.message||'별도 메모 없음'));logs.append(detail);});body.append(logs);
  }
  function render(){body.replaceChildren();tabButtons.forEach((b,i)=>{const active=tabs[i][0]===state.tab;b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1;});body.setAttribute('aria-labelledby','tab-'+state.tab);({overview,channels,contents,collection})[state.tab]();}
  render();
})();
</script>
<script>(()=>{let previous=0;const send=()=>{const height=Math.ceil(document.body.getBoundingClientRect().height);if(height!==previous){previous=height;parent.postMessage({type:'771-sns-dashboard-height',height},'*')}};new ResizeObserver(send).observe(document.body);addEventListener('load',send);send()})();</script>
